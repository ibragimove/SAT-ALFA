<div id="result-lightbox" class="result-lightbox" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Official Result">
  <div class="result-lightbox-backdrop" id="lightbox-backdrop"></div>
  <div class="result-lightbox-card" id="lightbox-card">
    <div class="result-lightbox-header">
      <div class="lightbox-student-info">
        <h3 class="lightbox-student-name" id="lightbox-student-name"></h3>
      </div>
      <div class="lightbox-header-right">
        <div class="lightbox-score-badge">
          <span class="lightbox-score-label">SAT SCORE</span>
          <span class="lightbox-score-value" id="lightbox-score-val"></span>
        </div>
        <button type="button" class="result-lightbox-close" id="lightbox-close-btn" aria-label="Close dialog">&times;</button>
      </div>
    </div>

    <div class="result-lightbox-body" id="lightbox-body">
      <div class="lightbox-img-wrap" id="lightbox-img-wrap">
        <div class="lightbox-loader" id="lightbox-loader"></div>
        <img id="lightbox-img" class="lightbox-img" src="" alt="Official SAT Result" style="display:none;">
      </div>
      <div class="lightbox-footer">
        <a id="lightbox-orig-link" href="#" target="_blank" rel="noopener" class="lightbox-orig-link">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
          <span>Open original</span>
        </a>
      </div>
    </div>
  </div>
</div>
