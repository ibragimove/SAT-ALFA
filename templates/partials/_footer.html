{% load core_tags %}
<footer id="site-footer" class="site-footer">
  <div class="container footer-container">
    <div class="footer-brand">
      <a href="#hero" class="brand-link" aria-label="SAT ALFA Home">
        <svg class="brand-logo" width="28" height="28" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <polygon points="50,15 85,65 15,65" stroke="currentColor" stroke-width="12" fill="none" stroke-linejoin="round"/>
          <path d="M30 75 L50 63 L70 75" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M35 87 L50 78 L65 87" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="brand-text">SAT ALFA</span>
      </a>
      <p class="footer-tagline">{% t 'meta_title' %}</p>
    </div>
    <div class="footer-bottom">
      <p class="footer-copy">&copy; {% now "Y" %} SAT ALFA. {% t 'footer_rights' %}</p>
    </div>
  </div>
</footer>
