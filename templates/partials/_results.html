{% load core_tags %}
<section id="results" class="section section-white section-results">
  <div class="container" data-carousel>
    <div class="carousel-section-head fade-up">
      <div class="carousel-heading-wrap">
        <h2 class="section-heading">{% t 'results_title' %}</h2>
        <p class="section-subtitle">{% t 'results_subtitle' %}</p>
      </div>

      <div class="carousel-controls">
        <button type="button" class="carousel-btn carousel-btn--prev" aria-label="Previous results">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <button type="button" class="carousel-btn carousel-btn--next" aria-label="Next results">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </div>
    </div>

    <!-- Carousel Container -->
    <div class="results-carousel-wrap fade-up">
      <div class="carousel-track">
        {% for res in results %}
          <div class="carousel-item result-card">
            {% if res.image %}
              <div class="result-card-media">
                <img src="{{ res.image.url }}" alt="{{ res.student_name|default:'SAT Result' }}" class="result-img" loading="lazy">
              </div>
            {% else %}
              <div class="result-card-cert">
                <span class="cert-watermark" aria-hidden="true">SAT</span>
                <div class="cert-badge">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 0L14.6 9.4L24 12L14.6 14.6L12 24L9.4 9.4L12 0Z"/>
                  </svg>
                  <span>OFFICIAL RESULT</span>
                </div>
                {% if res.student_name %}
                  <div class="result-student">{{ res.student_name }}</div>
                {% endif %}
              </div>
            {% endif %}

            <div class="result-card-footer">
              <span class="result-score-label">SAT SCORE</span>
              <div class="result-score">{{ res.score }}</div>
            </div>
          </div>
        {% endfor %}
      </div>
    </div>

    <!-- CTA Button -->
    <div class="results-cta-wrap fade-up">
      <a href="#contact" class="btn btn-secondary results-cta-btn" data-open-form>
        <svg class="btn-sparkle" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0L14.6 9.4L24 12L14.6 14.6L12 24L9.4 9.4L12 0Z"/>
        </svg>
        <span>{% t 'results_cta' %}</span>
      </a>
    </div>
  </div>
</section>
