{% load core_tags %}
<section id="events" class="section section-light section-events">
  <div class="container" data-carousel>
    <div class="carousel-section-head fade-up">
      <div class="carousel-heading-wrap">
        <h2 class="section-heading">{% t 'events_title' %}</h2>
      </div>

      <div class="carousel-controls">
        <button type="button" class="carousel-btn carousel-btn--prev" aria-label="Previous events">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <button type="button" class="carousel-btn carousel-btn--next" aria-label="Next events">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </div>
    </div>

    <!-- Carousel Container -->
    <div class="events-carousel-wrap fade-up">
      <div class="carousel-track">
        {% for evt in events %}
          <div class="carousel-item event-poster">
            {% if evt.image %}
              <div class="event-poster-media">
                <img src="{{ evt.image.url }}" alt="{{ evt.title }}" class="event-poster-img" loading="lazy">
              </div>
            {% else %}
              <div class="event-poster-gradient">
                <div class="event-decor-shape" aria-hidden="true"></div>
              </div>
            {% endif %}

            <div class="event-poster-overlay"></div>

            <div class="event-poster-content">
              {% if evt.date %}
                <span class="event-date-badge">{{ evt.date|date:"d M Y" }}</span>
              {% endif %}
              <h3 class="event-poster-title">{{ evt.title }}</h3>
              {% if evt.description %}
                <p class="event-poster-desc">{{ evt.description }}</p>
              {% endif %}
            </div>
          </div>
        {% endfor %}
      </div>
    </div>
  </div>
</section>
