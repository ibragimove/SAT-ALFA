{% load core_tags %}
<section id="faq" class="section section-light section-faq">
  <div class="container">
    <div class="faq-contact-grid">
      <!-- FAQ Column -->
      <div class="faq-column fade-up">
        <h2 class="section-heading faq-heading">{% t 'faq_title' %}</h2>
        <div class="faq-accordion" id="faq-accordion">
          {% for faq in faqs %}
            <div class="faq-item">
              <button type="button" class="faq-question" aria-expanded="false">
                <span class="faq-question-text">{{ faq.question }}</span>
                <span class="faq-icon" aria-hidden="true">
                  <span class="faq-icon-line faq-icon-line--h"></span>
                  <span class="faq-icon-line faq-icon-line--v"></span>
                </span>
              </button>
              <div class="faq-answer">
                <div class="faq-answer-inner">
                  <p>{{ faq.answer }}</p>
                </div>
              </div>
            </div>
          {% endfor %}
        </div>
      </div>

      <!-- Contact Column -->
      <div class="contact-column fade-up">
        <div class="contact-card" id="contact">
          <div class="contact-header">
            <h3 class="contact-title">{% t 'contact_title' %}</h3>
          </div>

          <form class="contact-form" id="contact-form" onsubmit="return false;" novalidate>
            <div class="form-group">
              <input type="text" name="name" id="contact-name" class="form-input" placeholder="{% t 'form_name_placeholder' %}" required autocomplete="name">
            </div>

            <div class="form-group">
              <input type="tel" name="phone" id="contact-phone" class="form-input" placeholder="+998 (__) ___-__-__" required autocomplete="tel">
            </div>

            <button type="button" class="btn btn-primary contact-submit-btn" id="contact-submit-btn">
              <svg class="btn-sparkle" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 0L14.6 9.4L24 12L14.6 14.6L12 24L9.4 14.6L0 12L9.4 9.4L12 0Z"/>
              </svg>
              <span>{% t 'form_submit' %}</span>
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
