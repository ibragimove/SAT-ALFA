{% load core_tags %}
<section id="hero" class="section section-hero">
  {% if site_settings.hero_video %}
    <video class="hero-video" autoplay muted loop playsinline
           {% if site_settings.hero_poster %}poster="{{ site_settings.hero_poster.url }}"{% endif %}>
      <source src="{{ site_settings.hero_video.url }}" type="video/mp4">
    </video>
  {% endif %}
  <div class="hero-overlay"></div>

  <div class="container hero-container">
    <div class="hero-content fade-up">
      <h1 class="hero-title">
        <span class="hero-title-line1">SAT ALFA</span>
        <span class="hero-title-line2">{{ site_settings.hero_title }}</span>
      </h1>
      {% if site_settings.hero_subtitle %}
        <p class="hero-subtitle">{{ site_settings.hero_subtitle }}</p>
      {% endif %}
      <a href="#contact" class="btn btn-primary hero-btn">
        <svg class="btn-sparkle" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0L14.6 9.4L24 12L14.6 14.6L12 24L9.4 14.6L0 12L9.4 9.4L12 0Z"/>
        </svg>
        <span>{% t 'hero_cta' %}</span>
      </a>
    </div>
  </div>
</section>
